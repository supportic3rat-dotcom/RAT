<script>
// Universal Government Banner Accordion Toggle
(function() {
  function initGovBannerToggle() {
    var banner = document.querySelector('.usa-banner');
    if (!banner) return;
    var content = banner.querySelector('.usa-banner__content, #gov-banner-default');
    if (!content) return;

    if (!banner._govInitDone) {
      banner._govInitDone = true;
      content.hidden = true;
      content.style.display = 'none';
    }

    var toggleBtn = banner.querySelector('.usa-banner__button');

    function toggleBanner(e) {
      if (e) {
        if (e.target.closest && e.target.closest('.usa-banner__content')) return;
        e.preventDefault();
        e.stopPropagation();
      }
      var isHidden = content.hidden || content.style.display === 'none';
      if (isHidden) {
        content.hidden = false;
        content.style.display = 'block';
        content.style.position = 'relative';
        content.style.left = 'auto';
        if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
      } else {
        content.hidden = true;
        content.style.display = 'none';
        if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
      }
    }

    var clickableTargets = banner.querySelectorAll('.usa-banner__button, .usa-banner__header-action, .usa-banner__button-text');
    clickableTargets.forEach(function(el) {
      el.style.cursor = 'pointer';
      el.onclick = toggleBanner;
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGovBannerToggle);
  } else {
    initGovBannerToggle();
  }
})();
</script>
